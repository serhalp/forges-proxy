name: Unit Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unit-test:
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        # The `engines` floor, and each supported major.
        node: ["22.18.0", "24", "26"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # pnpm and Node from `devEngines`; the action checks pnpm's npm signature.
      - uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          install: false
          runtime: node@${{ matrix.node }}
      - name: Prepare Socket Firewall
        uses: SocketDev/action@ba6de6cc0565af1f42295590380973573297e31f # v1.3.2
        with:
          mode: firewall-free
      - name: Install deps (Socket Firewall ✔️)
        run: sfw pnpm ci

      # Not `pnpm test`: pnpm runs scripts on the `devEngines` Node, whichever one the job installed.
      - run: node --conditions=@forges-proxy/source --test "packages/*/test/**/*.test.ts"

[build]
publish = "public"

# Prompts shown in the "Deploy to Netlify" template form.
[template.environment]
FORGES_PROXY_PUBLIC = "Set to 1 for a public, read-only instance. For a private instance, leave blank and set FORGES_PROXY_SECRET after deploying."
FORGES_GITHUB_TOKEN = "Optional. A GitHub token scoped only to public repositories (e.g. a fine-grained token with no repository permissions)."
